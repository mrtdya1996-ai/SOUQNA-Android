name: Build SOUQNA Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          unzip -o "$ZIP" -d project
          cd project
          find . -name package.json

      - name: Build APK
        run: |
          cd project
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOUQNA-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
